aid: contextai
name: Context.ai *
description: 'Context (context.ai) is a unified enterprise AI platform for building,
  deploying, and improving AI agents at scale. The product is organized into modular
  components: a Workspace for authoring agent workflows in plain English, an Engine
  with 800+ connectors and IdP-brokered identity, Unify as a knowledge/institutional-context
  repository, and Evals for rubric-based quality scoring. It is model-agnostic (Claude,
  GPT, Gemini, Kimi, or open weights) and offers hosted, VPC, on-prem, or air-gapped
  deployment. The company originated as a GV (Google Ventures) and Theory Ventures
  backed product-analytics-for-LLMs startup and now operates as an enterprise agent
  platform used by teams including Qualcomm, Stripe, and Palantir. This repo carries
  no public developer/API surface: the provider publishes no OpenAPI, SDKs, MCP server,
  or developer documentation, so most machine-readable artifacts are not applicable.'
